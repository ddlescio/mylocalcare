<style>
  .lc-interest-slot {
    position: absolute;
    right: 0.52rem;
    bottom: 0.52rem;
    z-index: 6;
  }

  .lc-interest-slot--public {
    right: 0.65rem;
    bottom: 0.65rem;
  }

  .lc-interest-slot--vetrina-mobile,
  .lc-interest-slot--vetrina-desktop {
    right: -0.2rem;
    bottom: -0.2rem;
  }

  .lc-interest-button {
    display: inline-flex;
    position: relative;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    min-height: 34px;
    padding: 0.22rem 0.6rem 0.22rem 0.3rem;
    gap: 0.26rem;
    border: 1px solid rgba(255, 255, 255, 0.76);
    border-radius: 9999px;
    background: linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.9),
      rgba(248, 250, 255, 0.83)
    );
    color: #25427f;
    box-shadow:
      0 0 0 0.65px rgba(96, 165, 250, 0.46),
      0 4px 12px rgba(15, 23, 42, 0.13),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(16px) saturate(130%);
    -webkit-backdrop-filter: blur(16px) saturate(130%);
    font-size: 0.67rem;
    font-weight: 730;
    letter-spacing: -0.01em;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      width 180ms ease,
      padding 180ms ease,
      gap 180ms ease,
      transform 150ms ease,
      background 180ms ease,
      border-color 180ms ease,
      box-shadow 180ms ease;
  }

  .lc-interest-button::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: inherit;
  }

  .lc-interest-label {
    max-width: 5rem;
    overflow: hidden;
    white-space: nowrap;
    opacity: 1;
    transition: max-width 180ms ease, opacity 120ms ease;
  }

  .lc-interest-button:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 255, 255, 0.94);
    box-shadow:
      0 0 0 0.75px rgba(59, 130, 246, 0.58),
      0 7px 18px rgba(15, 23, 42, 0.17),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  .lc-interest-button:focus-visible {
    outline: 3px solid rgba(59, 130, 246, 0.34);
    outline-offset: 2px;
  }

  .lc-interest-button:active {
    transform: scale(0.96);
  }

  .lc-interest-icon {
    width: 23.5px;
    height: 23.5px;
    flex: 0 0 23.5px;
    overflow: visible;
    filter: drop-shadow(0 1px 1px rgba(30, 58, 138, 0.13));
  }

  .lc-interest-house {
    fill: none;
    stroke: #3561d6;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: fill 180ms ease, stroke 180ms ease, stroke-width 180ms ease;
  }

  .lc-interest-heart-frame {
    fill: rgba(255, 255, 255, 0.96);
    stroke: #2949b7;
    stroke-width: 2.1;
    stroke-linejoin: round;
    transition: fill 180ms ease, stroke 180ms ease;
  }

  .lc-interest-heart {
    fill: rgba(236, 72, 153, 0.16);
    stroke: none;
    transform-origin: center;
    transition: fill 180ms ease, stroke 180ms ease, transform 220ms ease;
  }

  .lc-interest-button.is-active {
    min-width: 34px;
    min-height: 34px;
    padding: 0;
    gap: 0;
    border-color: rgba(255, 255, 255, 0.86);
    background: rgba(248, 250, 255, 0.92);
    box-shadow:
      0 0 0 0.75px rgba(59, 130, 246, 0.56),
      0 5px 14px rgba(15, 23, 42, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);
  }

  .lc-interest-button.is-active .lc-interest-house {
    fill: none;
    stroke: #3159d0;
    stroke-width: 2.35;
  }

  .lc-interest-button.is-active .lc-interest-heart {
    fill: #f23894;
    stroke: none;
    animation: lcInterestPop 260ms ease;
  }

  .lc-interest-button.is-active .lc-interest-heart-frame {
    stroke: #2444aa;
  }

  .lc-interest-button.is-active .lc-interest-label {
    max-width: 0;
    opacity: 0;
  }

  .lc-interest-slot--vetrina-mobile .lc-interest-button,
  .lc-interest-slot--vetrina-desktop .lc-interest-button {
    width: 32px;
    min-width: 32px;
    min-height: 32px;
    padding: 0;
  }

  .lc-interest-slot--vetrina-mobile .lc-interest-label,
  .lc-interest-slot--vetrina-desktop .lc-interest-label {
    display: none;
  }

  .lc-interest-slot--vetrina-mobile .lc-interest-button::after,
  .lc-interest-slot--vetrina-desktop .lc-interest-button::after {
    inset: -6px;
  }

  .lc-interest-slot--vetrina-mobile .lc-interest-icon,
  .lc-interest-slot--vetrina-desktop .lc-interest-icon {
    width: 22px;
    height: 22px;
    flex-basis: 22px;
  }

  .lc-interest-button.is-pending {
    pointer-events: none;
    opacity: 0.68;
  }

  @keyframes lcInterestPop {
    0% { transform: scale(0.72); }
    65% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .lc-interest-button,
    .lc-interest-house,
    .lc-interest-heart,
    .lc-interest-heart-frame {
      transition: none;
      animation: none !important;
    }
  }

  .lc-interest-toast {
    position: fixed;
    left: 50%;
    bottom: calc(1rem + env(safe-area-inset-bottom));
    z-index: 11000;
    width: min(92vw, 31rem);
    transform: translateX(-50%);
    padding: 0.9rem 1rem;
    border: 1px solid rgba(191, 219, 254, 0.95);
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.98);
    color: #334155;
    box-shadow: 0 20px 55px rgba(15, 23, 42, 0.24);
    font-size: 0.86rem;
    font-weight: 650;
    line-height: 1.4;
  }

  .lc-interest-toast a {
    display: inline-flex;
    margin-top: 0.55rem;
    color: #1d4ed8;
    font-weight: 850;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>

<script>
(function () {
  if (window.__lcInterestButtonsReady) return;
  window.__lcInterestButtonsReady = true;

  const csrfToken = {{ csrf_token()|tojson }};
  const requestsInFlight = new Set();

  function setState(button, active) {
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-pressed", active ? "true" : "false");
    button.setAttribute(
      "aria-label",
      active ? "Rimuovi interesse" : "Mi interessa"
    );
  }

  function setAnnouncementState(announcementId, active) {
    document.querySelectorAll(
      `.js-interest-button[data-annuncio-id="${announcementId}"]`
    ).forEach((button) => setState(button, active));
  }

  function setPending(announcementId, pending) {
    document.querySelectorAll(
      `.js-interest-button[data-annuncio-id="${announcementId}"]`
    ).forEach((button) => {
      button.classList.toggle("is-pending", pending);
      button.disabled = pending;
    });
  }

  function showMessage(message, actionLabel, actionUrl) {
    document.querySelector(".lc-interest-toast")?.remove();

    const toast = document.createElement("div");
    toast.className = "lc-interest-toast";
    toast.setAttribute("role", "alert");

    const text = document.createElement("div");
    text.textContent = message || "Operazione non riuscita.";
    toast.appendChild(text);

    if (actionLabel && actionUrl) {
      const action = document.createElement("a");
      action.href = actionUrl;
      action.textContent = actionLabel;
      toast.appendChild(action);
    }

    document.body.appendChild(toast);
    window.setTimeout(() => toast.remove(), 8000);
  }

  document.addEventListener("click", async (event) => {
    const button = event.target.closest(".js-interest-button");
    if (!button) return;

    event.preventDefault();
    event.stopPropagation();

    const announcementId = Number(button.dataset.annuncioId || 0);
    const endpoint = button.dataset.endpoint || "";

    if (!announcementId || !endpoint || requestsInFlight.has(announcementId)) {
      return;
    }

    const previousState = button.getAttribute("aria-pressed") === "true";
    const requestedState = !previousState;

    requestsInFlight.add(announcementId);
    setAnnouncementState(announcementId, requestedState);
    setPending(announcementId, true);

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json",
          "X-CSRF-Token": csrfToken,
          "X-Requested-With": "XMLHttpRequest"
        },
        body: JSON.stringify({ attivo: requestedState })
      });

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw Object.assign(
          new Error(data.error || "Operazione non riuscita."),
          { responseData: data }
        );
      }

      setAnnouncementState(announcementId, data.attivo === true);

    } catch (error) {
      setAnnouncementState(announcementId, previousState);

      const data = error.responseData || {};
      showMessage(
        error.message,
        data.action_label,
        data.action_url
      );

    } finally {
      requestsInFlight.delete(announcementId);
      setPending(announcementId, false);
    }
  });
})();
</script>
